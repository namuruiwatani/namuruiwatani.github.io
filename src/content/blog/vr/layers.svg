<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="420" rx="18" fill="#0f2740"/>
<text x="400" y="46" text-anchor="middle" font-size="24" fill="#fff" font-weight="bold">Три уровня полного погружения</text>
<g>
<rect x="40" y="80" width="720" height="82" rx="12" fill="#2f86e8"/>
<text x="64" y="115" font-size="21" fill="#fff" font-weight="bold">Уровень 1. Глаза и уши</text>
<text x="64" y="143" font-size="16" fill="#e6f4ff">Шлемы и очки: Valve Steam Frame, Meta VR Glasses, Varjo</text>
<rect x="40" y="178" width="720" height="82" rx="12" fill="#4fa6ec"/>
<text x="64" y="213" font-size="21" fill="#0f2740" font-weight="bold">Уровень 2. Тело</text>
<text x="64" y="241" font-size="16" fill="#0f2740">Перчатки HaptX, костюмы Teslasuit, платформа Omni One, запахи OVR</text>
<rect x="40" y="276" width="720" height="82" rx="12" fill="#c9e8ff"/>
<text x="64" y="311" font-size="21" fill="#0f2740" font-weight="bold">Уровень 3. Мозг</text>
<text x="64" y="339" font-size="16" fill="#0f2740">Neuralink, Synchron, Merge Labs, Nudge, исследования Питтсбурга</text>
</g>
<text x="400" y="394" text-anchor="middle" font-size="14" fill="#9bb7d2">Чем ниже, тем ближе к настоящему full dive и тем дальше от рынка</text>
</svg>
